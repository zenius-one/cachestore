name: CI

# Builds, vets and tests every package that changed (Turborepo decides what). Markdown-only
# changes start nothing.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/cachestore-go/go.mod
          cache-dependency-path: packages/cachestore-go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build lint check-types test
