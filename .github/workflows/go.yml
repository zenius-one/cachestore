name: Go

# Runs only when the Go implementation changes. Markdown-only changes start nothing.
on:
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
      - "!**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test -race ./...
